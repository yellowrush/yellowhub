<!DOCTYPE html>
<html>
<head>
	<meta http-equiv="X-UA-Compatible" content="IE=edge" />
	<meta http-equiv="Content-Type" content="text/html;charset=utf-8" >
	<title>Memory Game</title>

<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/font-awesome/4.6.1/css/font-awesome.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Coda">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/sweetalert2/3.0.3/sweetalert2.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/3.5.2/animate.css">
<style type="text/css">

html,
body {
  width: 100%;
  height: 100%;
}

body {
  display: -webkit-box;
  display: -ms-flexbox;
  display: flex;
  -webkit-box-pack: center;
      -ms-flex-pack: center;
          justify-content: center;
  -webkit-box-align: center;
      -ms-flex-align: center;
          align-items: center;
  -webkit-box-orient: vertical;
  -webkit-box-direction: normal;
      -ms-flex-direction: column;
          flex-direction: column;
  background: #FF9090;
  overflow: hidden;
  font-family: 'Coda', cursive;
}

.deck {
  width: 345px;
  margin: 0 auto;
  background: #FFFA62;
  padding: 16px;
  border-radius: 10px;
  box-shadow: 14px 14px 0 0 #000000;
}
.deck .card {
  height: 75px;
  width: 75px;
  background: #FFCF7F;
  display: inline-block;
  margin: 0 15px 15px 0;
  line-height: 140px;
  font-size: 0;
  color: #ffffff;
  text-align: center;
  border-radius: 8px;
  vertical-align: top;
  cursor: pointer;
  -webkit-transform: rotateY(180deg);
          transform: rotateY(180deg);
  -webkit-transform-style: preserve-3d;
          transform-style: preserve-3d;
  -webkit-transition: -webkit-transform .3s ease;
  transition: -webkit-transform .3s ease;
  transition: transform .3s ease;
  transition: transform .3s ease, -webkit-transform .3s ease;
  font-family: FontAwesome;
  line-height: 75px;
}
.deck .card:nth-child(4n) {
  margin: 0 0 15px 0;
}
.deck .card:nth-child(n+13) {
  margin: 0 15px 0 0;
}
.deck .card:nth-child(n+13):nth-child(4n) {
  margin: 0;
}
.deck .card.open {
  -webkit-transform: rotateY(0);
          transform: rotateY(0);
  background: #89C4FF;
  cursor: default;
}
.deck .card.show {
  font-size: 33px;
}
.deck .card.match {
  -webkit-transform: rotateY(0);
          transform: rotateY(0);
  cursor: default;
  background: #9BCB3C;
  font-size: 33px;
}
.deck .card.notmatch {
  background: #EE0E51;
}

#score-panel {
  text-align: left;
  width: 345px;
  margin-bottom: 10px;
}
#score-panel .stars {
  margin: 0;
  padding: 0;
  display: inline-block;
  margin: 0 5px 0 0;
}
#score-panel .stars li {
  list-style: none;
  display: inline-block;
}
#score-panel .restart {
  float: right;
  cursor: pointer;
}

*::-moz-selection {
  background: transparent;
}

*::selection {
  background: transparent;
}

.swal2-overlay {
  background-color: white;
}

</style>



<style id="yellowhub-warm-theme">
/* ================================================
   YellowHub Warm Theme Overlay — animal-island-ui
   Primary palette: cream / warm brown / mint teal
   ================================================ */

:root {
  --warm-bg: #fdf6ec;
  --warm-bg2: #fff9f0;
  --warm-text: #794f27;
  --warm-text-light: #a8845e;
  --warm-accent: #19c8b9;
  --warm-accent-dark: #11a89b;
  --warm-shadow: #bdaea0;
  --warm-border: rgba(189, 174, 160, 0.4);
  --warm-card: rgba(255, 249, 240, 0.95);
  --warm-danger: #e05c5c;
  --warm-success: #5cb85c;
  --warm-btn-shadow: 0 4px 0 0 var(--warm-shadow);
}

/* --- YellowHub game header bar --- */
#yellowhub-header {
  position: fixed !important;
  top: 0 !important;
  left: 0 !important;
  right: 0 !important;
  z-index: 9999 !important;
  height: 44px !important;
  background: var(--warm-bg) !important;
  border-bottom: 1px solid var(--warm-border) !important;
  display: flex !important;
  align-items: center !important;
  justify-content: space-between !important;
  padding: 0 16px !important;
  font-family: 'Nunito', 'Avenir Next', Avenir, sans-serif !important;
  box-shadow: 0 2px 8px rgba(189, 174, 160, 0.2) !important;
}

#yellowhub-header a {
  text-decoration: none !important;
  color: var(--warm-text) !important;
  font-weight: 700 !important;
  font-size: 14px !important;
  display: flex !important;
  align-items: center !important;
  gap: 6px !important;
}

#yellowhub-header a:hover {
  color: var(--warm-accent) !important;
}

#yellowhub-header .header-title {
  color: var(--warm-text) !important;
  font-weight: 700 !important;
  font-size: 15px !important;
}

/* --- Warm body background for games without explicit bg --- */
body {
  font-family: 'Nunito', 'Avenir Next', Avenir, sans-serif !important;
}

/* --- dragUp & lineUp: override dark/gray backgrounds --- */
.level-list {
  background: var(--warm-bg) !important;
}

.level-list__item {
  background: var(--warm-bg2) !important;
  color: var(--warm-text) !important;
  border: 1px solid var(--warm-border) !important;
}

.level-list__item:hover {
  background: white !important;
  color: var(--warm-accent) !important;
  border-color: var(--warm-accent) !important;
}

.level-list__item.is-playing {
  background: var(--warm-accent) !important;
  color: white !important;
  border-color: var(--warm-accent-dark) !important;
}

.level-list__item__check {
  background: var(--warm-text) !important;
}

/* --- Buttons: override #09F, #BBB, #2ecc71 blue/gray/green to warm style --- */
.button,
button:not(#yellowhub-header button):not([class*="swal"]) {
  font-family: 'Nunito', 'Avenir Next', Avenir, sans-serif !important;
  background: var(--warm-bg2) !important;
  color: var(--warm-text) !important;
  border: 1px solid var(--warm-border) !important;
  border-radius: 8px !important;
  box-shadow: var(--warm-btn-shadow) !important;
  transition: transform 0.1s, box-shadow 0.1s !important;
}

.button:hover,
button:not(#yellowhub-header button):not([class*="swal"]):hover {
  background: var(--warm-accent) !important;
  color: white !important;
  border-color: var(--warm-accent-dark) !important;
  box-shadow: 0 5px 0 0 var(--warm-accent-dark) !important;
  transform: translateY(-1px) !important;
}

.button:active,
button:not(#yellowhub-header button):not([class*="swal"]):active {
  transform: translateY(2px) !important;
  box-shadow: 0 1px 0 0 var(--warm-shadow) !important;
}

.next-level-button {
  background: var(--warm-accent) !important;
}

.next-level-button:hover {
  background: var(--warm-accent-dark) !important;
}

/* --- lineUp: override dark navy background --- */
body[style*="background-color: #2c3e50"],
body[style*="background:#2c3e50"] {
  background-color: var(--warm-bg) !important;
}

section {
  background-color: var(--warm-bg2) !important;
}

/* --- findUp: override bright background colors to warm pastels --- */
.card-flipped-front {
  background: var(--warm-bg) !important;
}

/* --- alignUp: sidebar panel --- */
.sidebar h1,
.sidebar h2 {
  color: var(--warm-text) !important;
  font-family: 'Nunito', sans-serif !important;
}

.panel {
  background: var(--warm-bg2) !important;
  border: 1px solid var(--warm-border) !important;
  border-radius: 12px !important;
}

.start button {
  background: var(--warm-accent) !important;
  color: white !important;
  box-shadow: 0 4px 0 0 var(--warm-accent-dark) !important;
}

/* --- Radio buttons warm accent --- */
input[type="radio"]:checked {
  accent-color: var(--warm-accent) !important;
}

/* --- Make room for the header bar (44px) --- */
body {
  padding-top: 44px !important;
}

canvas {
  top: 44px !important;
}

/* --- Wrapper warm background --- */
.wrapper {
  background: var(--warm-bg) !important;
}
</style>

<body>

<div id="yellowhub-header">
  <a href="javascript:window.close ? window.close() : history.back()">← 返回</a>
  <span class="header-title">🎮 Find Up — 寻宝记忆</span>
  <a href="/" style="font-size:12px; opacity:0.6;">YellowHub</a>
</div>

<div id="score-panel">
	<ul class="stars">
		<li><i class="fa fa-star"></i></li>
		<li><i class="fa fa-star"></i></li>
		<li><i class="fa fa-star"></i></li>
	</ul>
	<span class="moves">0</span> Moves
	<div class="restart">
		<i class="fa fa-repeat"></i>
	</div>
</div>
<ul class="deck"></ul>

<script
  src="https://code.jquery.com/jquery-2.2.4.min.js"
  integrity="sha256-BbhdlvQf/xTY9gja0Dq3HiwQF8LaCRTXxZKRutelT44="
  crossorigin="anonymous"></script>
<script type="text/javascript" src="https://cdn.jsdelivr.net/sweetalert2/3.0.3/sweetalert2.min.js"></script>

<script type="text/javascript">
var symbols = ['bicycle', 'bicycle', 'leaf', 'leaf', 'cube', 'cube', 'anchor', 'anchor', 'paper-plane-o', 'paper-plane-o', 'bolt', 'bolt', 'bomb', 'bomb', 'diamond', 'diamond'],
		opened = [],
		match = 0,
		moves = 0,
		$deck = $('.deck'),
		$scorePanel = $('#score-panel'),
		$moveNum = $scorePanel.find('.moves'),
		$ratingStars = $scorePanel.find('i'),
		$restart = $scorePanel.find('.restart'),
		delay = 800,
		gameCardsQTY = symbols.length / 2,
		rank3stars = gameCardsQTY + 2,
		rank2stars = gameCardsQTY + 6,
		rank1stars = gameCardsQTY + 10;

// Shuffle function From http://stackoverflow.com/a/2450976
function shuffle(array) {
  var currentIndex = array.length, temporaryValue, randomIndex;
	
  while (0 !== currentIndex) {
    randomIndex = Math.floor(Math.random() * currentIndex);
    currentIndex -= 1;
    temporaryValue = array[currentIndex];
    array[currentIndex] = array[randomIndex];
    array[randomIndex] = temporaryValue;
  }

  return array;
}

// Initial Game
function initGame() {
	var cards = shuffle(symbols);
  $deck.empty();
  match = 0;
  moves = 0;
  $moveNum.html(moves);
  $ratingStars.removeClass('fa-star-o').addClass('fa-star');
	for (var i = 0; i < cards.length; i++) {
		$deck.append($('<li class="card"><i class="fa fa-' + cards[i] + '"></i></li>'))
	}
};

// Set Rating and final Score
function setRating(moves) {
	var rating = 3;
	if (moves > rank3stars && moves < rank2stars) {
		$ratingStars.eq(2).removeClass('fa-star').addClass('fa-star-o');
		rating = 2;
	} else if (moves > rank2stars && moves < rank1stars) {
		$ratingStars.eq(1).removeClass('fa-star').addClass('fa-star-o');
		rating = 1;
	} else if (moves > rank1stars) {
		$ratingStars.eq(0).removeClass('fa-star').addClass('fa-star-o');
		rating = 0;
	}	
	return { score: rating };
};

// End Game
function endGame(moves, score) {
	swal({
		allowEscapeKey: false,
		allowOutsideClick: false,
		title: 'Congratulations! You Won!',
		text: 'With ' + moves + ' Moves and ' + score + ' Stars.\nBoom Shaka Lak!',
		type: 'success',
		confirmButtonColor: '#9BCB3C',
		confirmButtonText: 'Play again!'
	}).then(function(isConfirm) {
		if (isConfirm) {
			initGame();
		}
	})
}

// Restart Game
$restart.on('click', function() {
  swal({
    allowEscapeKey: false,
    allowOutsideClick: false,
    title: 'Are you sure?',
    text: "Your progress will be Lost!",
    type: 'warning',
    showCancelButton: true,
    confirmButtonColor: '#9BCB3C',
    cancelButtonColor: '#EE0E51',
    confirmButtonText: 'Yes, Restart Game!'
  }).then(function(isConfirm) {
    if (isConfirm) {
      initGame();
    }
  })
});

// Card flip
$deck.on('click', '.card:not(".match, .open")', function() {
	if($('.show').length > 1) { return true; }
	
	var $this = $(this),
			card = $this.context.innerHTML;
  $this.addClass('open show');
	opened.push(card);

	// Compare with opened card
  if (opened.length > 1) {
    if (card === opened[0]) {
      $deck.find('.open').addClass('match animated infinite rubberBand');
      setTimeout(function() {
        $deck.find('.match').removeClass('open show animated infinite rubberBand');
      }, delay);
      match++;
    } else {
      $deck.find('.open').addClass('notmatch animated infinite wobble');
			setTimeout(function() {
				$deck.find('.open').removeClass('animated infinite wobble');
			}, delay / 1.5);
      setTimeout(function() {
        $deck.find('.open').removeClass('open show notmatch animated infinite wobble');
      }, delay);
    }
    opened = [];
		moves++;
		setRating(moves);
		$moveNum.html(moves);
  }
	
	// End Game if match all cards
	if (gameCardsQTY === match) {
		setRating(moves);
		var score = setRating(moves).score;
		setTimeout(function() {
			endGame(moves, score);
		}, 500);
  }
});

initGame();

</script>


</body>
